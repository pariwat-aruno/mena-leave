<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>อนุมัติใบลา — MENA COSMETICS</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <img class="logo" src="./img/logo.jpg" alt="logo" onerror="this.style.visibility='hidden'">
    <div class="brand">
      <div class="brand-name">MENA COSMETICS</div>
      <div class="page-title">รายการรออนุมัติ</div>
    </div>
  </header>

  <main class="app-main">
    <div id="loading" class="loader"><div class="spinner"></div>กำลังโหลด...</div>

    <div id="not-allowed" class="hidden">
      <div class="alert warning">คุณไม่มีรายการที่ต้องอนุมัติ</div>
      <p class="subtle">เฉพาะหัวหน้างาน / HR / ผู้บริหาร ที่จะเห็นรายการที่นี่</p>
    </div>

    <div id="content" class="hidden">
      <div id="my-role" class="card soft mb-2"></div>
      <div id="target-note" class="alert info mb-2 hidden"></div>
      <div id="list"></div>
    </div>

    <!-- decision overlay -->
    <div id="decision-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;overflow-y:auto;padding:20px">
      <div style="max-width:480px;margin:0 auto;background:white;border-radius:10px;padding:16px;position:relative">
        <button id="btn-close-decision" style="position:absolute;top:8px;right:8px;background:none;border:none;font-size:24px;cursor:pointer">✕</button>
        <h2 class="section-title" id="decision-title">ตัดสินใจ</h2>
        <div id="decision-body"></div>

        <div class="form-group mt-2">
          <label>หมายเหตุ <span class="subtle">(ไม่อนุมัติ / ขอเอกสารเพิ่ม ต้องระบุ)</span></label>
          <textarea id="decision-note" maxlength="200" placeholder="เช่น ขอใบรับรองแพทย์ฉบับจริง / ไม่อนุมัติเพราะ..."></textarea>
        </div>

        <div id="decision-alert" class="hidden"></div>

        <!-- ขอเอกสารเพิ่ม = ใบยังค้างชั้นนี้ ส่งเรื่องกลับให้ผู้ลาแนบ แล้วกลับมาที่คุณ -->
        <button class="btn secondary block mt-1" id="btn-request-doc">ขอเอกสารเพิ่มจากผู้ลา</button>
        <div class="btn-row">
          <button class="btn danger" id="btn-reject">❌ ไม่อนุมัติ</button>
          <button class="btn primary" id="btn-approve">✅ อนุมัติ</button>
        </div>
      </div>
    </div>

    <div class="page-footer">MENA COSMETICS</div>
  </main>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/role.js"></script>
<script src="./js/utils.js"></script>
<script>
let CURRENT_LEAVE = null;
let CURRENT_STAGE = 0;

(async function () {
  try { await window.auth.init(); }
  catch (err) {
    document.getElementById('loading').innerHTML = '<div class="alert error">' + err.message + '</div>';
    return;
  }

  const status = await window.api.post('getMyStatus', { lineUserId: window.state.lineUserId });
  document.getElementById('loading').classList.add('hidden');

  if (!status.ok || status.status !== 'active') {
    document.getElementById('not-allowed').classList.remove('hidden');
    return;
  }

  document.getElementById('content').classList.remove('hidden');
  const u = status.user;
  document.getElementById('my-role').innerHTML =
    '<div><strong>' + window.utils.escapeHtml(u.display_name) + '</strong></div>' +
    '<div class="subtle">บทบาท: <span class="badge ' + window.getRoleBadgeClass(u.role, u.is_supervisor) + '">' +
    window.getRoleLabelTh(u.role, u.is_supervisor) + '</span></div>';

  await loadList();
})();

/** ใบที่เปิดมาจากปุ่มในการ์ดไลน์ (?id=) */
function targetLeaveId() {
  const q = new URLSearchParams(location.search);
  return q.get('id') ||
    new URLSearchParams((q.get('liff.state') || '').replace(/^[^?]*\?/, '')).get('id') || '';
}

async function loadList() {
  const list = document.getElementById('list');
  let r = await window.api.post('getPendingForMe', { lineUserId: window.state.lineUserId });
  // เน็ตในไลน์สะดุดบ่อย — ลองใหม่ให้เองหนึ่งครั้งก่อนบอกว่าพัง
  if (!r.ok && (r.error === 'network_error' || r.error === 'invalid_response')) {
    await new Promise(res => setTimeout(res, 1500));
    r = await window.api.post('getPendingForMe', { lineUserId: window.state.lineUserId });
  }
  if (!r.ok) {
    list.innerHTML = '<div class="alert error">โหลดรายการไม่สำเร็จ — สัญญาณอินเทอร์เน็ตอาจสะดุด</div>' +
      '<button class="btn primary block mt-1" id="btn-retry-list">ลองอีกครั้ง</button>';
    document.getElementById('btn-retry-list').onclick = () => {
      list.innerHTML = '<div class="loader"><div class="spinner"></div>กำลังโหลด...</div>';
      loadList();
    };
    return;
  }
  // ใช้ ?id= แค่ครั้งแรก — กดตัดสินแล้วโหลดรายการใหม่ จะได้ไม่เด้งกล่องเดิมซ้ำ
  const wantId = window._idConsumed ? '' : targetLeaveId();
  window._idConsumed = true;
  if (wantId) {
    const idx = r.pending.findIndex(p => p.leave_id === wantId);
    if (idx >= 0) {
      window._pending = r.pending;
      renderPending(r.pending);
      openDecision(idx);
      return;
    }
    // ใบจากการ์ดไม่อยู่ในมือเราแล้ว — บอกเหตุผล ไม่ปล่อยให้เจอหน้าว่างแล้วงง
    await explainNotMine(wantId);
  }
  renderPending(r.pending);
}

async function explainNotMine(leaveId) {
  const box = document.getElementById('target-note');
  const one = await window.api.post('getOneRequest', { lineUserId: window.state.lineUserId, leave_id: leaveId });
  let msg = 'ใบลา ' + leaveId + ' ไม่ได้รอคุณตัดสินแล้ว';
  if (one.ok && one.leave) {
    const l = one.leave;
    const status = window.STATUS_LABELS[l.final_status] || l.final_status;
    if (l.final_status !== 'pending') {
      msg = 'ใบลา ' + leaveId + ' ตัดสินไปแล้ว — สถานะ: ' + status;
      const last = [3, 2, 1].map(n => ({ n, st: l['stage' + n + '_status'], at: l['stage' + n + '_at'], note: l['stage' + n + '_note'] }))
        .find(x => x.st === 'approved' || x.st === 'rejected');
      if (last && last.at) msg += ' (เมื่อ ' + window.utils.formatThaiDateTime(last.at) + ')';
    } else {
      msg = 'ใบลา ' + leaveId + ' ยังรออยู่ แต่ตอนนี้อยู่ที่ผู้อนุมัติชั้นอื่น ไม่ใช่คุณ';
    }
  }
  box.textContent = msg;
  box.classList.remove('hidden');
}

function renderPending(pending) {
  const r = { pending: pending };
  const list = document.getElementById('list');
  if (!r.pending.length) {
    list.innerHTML = '<div class="empty"><div class="icon">✓</div>ไม่มีรายการรออนุมัติ</div>';
    return;
  }
  list.innerHTML = '<h2 class="section-title">มี ' + r.pending.length + ' รายการรออนุมัติ</h2>' +
    r.pending.map((p, i) => {
      const stageLabel = p.hr_fallback ? 'ชั้น 3 (HR แทนผู้บริหาร)'
        : p.owner_first ? 'ชั้น 1 (ผู้บริหาร)'
        : ({ 1: 'ชั้น 1 (หัวหน้างาน)', 2: 'ชั้น 2 (HR)', 3: 'ชั้น 3 (ผู้บริหาร)' })[p.my_stage];
      const isCancel = p.record_type === 'cancel';
      return '<div class="card mb-1">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<div><strong>' + window.utils.escapeHtml(p.requester_name || '-') + '</strong>' +
          (p.requester_dept ? ' <span class="subtle">· ' + window.utils.escapeHtml(p.requester_dept) + '</span>' : '') +
          '</div>' +
          '<span class="badge pending">' + stageLabel + '</span>' +
        '</div>' +
        (isCancel
          ? '<div class="alert info mt-1">ใบขอยกเลิกวันลาที่อนุมัติไปแล้ว (ใบ ' +
            window.utils.escapeHtml(p.parent_leave_id || '-') + ') — อนุมัติแล้วจะคืนโควตาให้ผู้ลา</div>'
          : '') +
        (p.is_emergency
          ? '<div class="alert warning mt-1"><strong>แจ้งไม่ทันกำหนด — ระบุว่าเป็นกรณีฉุกเฉิน</strong><div>' +
            window.utils.escapeHtml(p.emergency_reason || 'ไม่ได้ระบุเหตุผล') + '</div></div>'
          : '') +
        (Number(p.reminder_count) > 0
          ? '<div class="alert error mt-1">ใบนี้ถูกเตือนไปแล้ว ' + Number(p.reminder_count) + ' ครั้ง</div>'
          : '') +
        (p.hr_fallback
          ? '<div class="alert warning mt-1"><strong>HR ตัดสินแทนผู้บริหารได้</strong><div>' +
            window.utils.escapeHtml(p.hr_fallback_reason || '') + '</div></div>'
          : '') +
        (p.doc_request_status === 'requested'
          ? '<div class="alert info mt-1"><strong>รอผู้ลาแนบเอกสารเพิ่ม</strong><div>ขอไว้ว่า: ' +
            window.utils.escapeHtml(p.doc_request_note || '-') + '</div></div>'
          : p.doc_request_status === 'submitted'
          ? '<div class="alert success mt-1"><strong>ผู้ลาแนบเอกสารที่ขอแล้ว</strong></div>'
          : '') +
        (p.doc_pending
          ? '<div class="alert warning mt-1">ยังไม่มีใบรับรองแพทย์ — ผู้ลาจะแนบตามมาภายหลัง</div>'
          : '') +
        '<div class="card-row mt-1"><span class="label">ประเภท</span><span class="value">' + (window.LEAVE_TYPE_LABELS[p.leave_type] || p.leave_type) + (p.is_retroactive && !isCancel ? ' (ย้อนหลัง)' : '') + '</span></div>' +
        '<div class="card-row"><span class="label">วันที่</span><span class="value">' + window.utils.formatThaiDateShort(p.date_from) + (p.date_from === p.date_to ? '' : ' - ' + window.utils.formatThaiDateShort(p.date_to)) + ' (' + window.utils.escapeHtml(p.amount_text || (p.days + ' วัน')) + ')</span></div>' +
        '<div class="card-row"><span class="label">เหตุผล</span><span class="value">' + window.utils.escapeHtml(p.reason || '-') + '</span></div>' +
        attachmentLinks(p) +
        // ใบขอยกเลิกไม่ได้เก็บพิกัด — ไม่ต้องขึ้นธง "ไม่มีพิกัดยืนยัน" ให้เข้าใจผิด
        (isCancel ? ''
        : p.gps_lat
          ? '<div class="text-center mt-1"><a class="btn ghost sm" target="_blank" href="https://www.google.com/maps?q=' + p.gps_lat + ',' + p.gps_lng + '">ดูตำแหน่ง GPS</a></div>'
          : '<div class="gps-missing mt-1"><strong>⚠️ ไม่มีพิกัดยืนยัน</strong><div>' +
              (p.gps_missing_reason
                ? 'ผู้ลาแจ้งว่า: ' + window.utils.escapeHtml(p.gps_missing_reason)
                : 'ผู้ลาไม่ได้ระบุเหตุผล') +
            '</div></div>') +
        '<button class="btn primary block mt-2" onclick="openDecision(' + i + ')">ตัดสินใจ</button>' +
      '</div>';
    }).join('');

  window._pending = r.pending;
}

/** ลิงก์ไฟล์แนบตอนส่ง + ที่แนบเพิ่มทีหลัง */
function attachmentLinks(p) {
  const links = [];
  if (p.attachment_url) links.push({ url: p.attachment_url, label: 'ไฟล์แนบตอนส่ง' });
  (p.extra_attachments || []).forEach((a, i) => {
    links.push({ url: a.url, label: 'แนบเพิ่ม ' + (i + 1) + (a.at ? ' · ' + window.utils.formatThaiDateTime(a.at) : '') +
      (a.note ? ' · ' + a.note : '') });
  });
  if (!links.length) return '';
  return '<div class="mt-1">' + links.map(l =>
    '<a class="btn ghost sm block mt-1" style="min-height:44px;display:flex;align-items:center;justify-content:center" target="_blank" rel="noopener" href="' + window.utils.escapeHtml(l.url) + '">' +
    window.utils.escapeHtml(l.label) + '</a>').join('') + '</div>';
}

function openDecision(idx) {
  const p = window._pending[idx];
  CURRENT_LEAVE = p;
  CURRENT_STAGE = p.my_stage;
  const isCancel = p.record_type === 'cancel';
  document.getElementById('decision-title').textContent =
    (isCancel ? 'ตัดสินใจใบขอยกเลิก ชั้น ' : 'ตัดสินใจชั้น ') + p.my_stage + ': ' + (p.requester_name || '');
  document.getElementById('decision-body').innerHTML =
    (isCancel ? '<div class="alert info">อนุมัติแล้ววันลาใบ ' + window.utils.escapeHtml(p.parent_leave_id || '-') +
      ' จะถูกยกเลิกและคืนโควตา ' + p.days + ' วันให้ผู้ลา</div>' : '') +
    (p.is_emergency ? '<div class="alert warning">แจ้งไม่ทันกำหนด — ฉุกเฉิน: ' +
      window.utils.escapeHtml(p.emergency_reason || '-') + '</div>' : '') +
    '<div class="card-row"><span class="label">เลขที่</span><span class="value">' + p.leave_id + '</span></div>' +
    '<div class="card-row"><span class="label">ประเภท</span><span class="value">' + (window.LEAVE_TYPE_LABELS[p.leave_type] || p.leave_type) + '</span></div>' +
    '<div class="card-row"><span class="label">วันที่</span><span class="value">' + window.utils.formatThaiDateShort(p.date_from) + ' - ' + window.utils.formatThaiDateShort(p.date_to) + '</span></div>' +
    '<div class="card-row"><span class="label">จำนวน</span><span class="value">' + window.utils.escapeHtml(p.amount_text || (p.days + ' วัน')) + '</span></div>' +
    '<div class="card-row"><span class="label">เหตุผล</span><span class="value">' + window.utils.escapeHtml(p.reason || '-') + '</span></div>';
  document.getElementById('decision-note').value = '';
  window.utils.clearAlert('#decision-alert');
  document.getElementById('decision-overlay').classList.remove('hidden');
}

document.getElementById('btn-close-decision').onclick = () => {
  document.getElementById('decision-overlay').classList.add('hidden');
};

async function decide(decision) {
  if (!CURRENT_LEAVE) return;
  const note = document.getElementById('decision-note').value.trim();

  // ปฏิเสธต้องระบุเหตุผลเสมอ (PDF ข้อ 2) — เพื่อให้ผู้ลา/HR/ผู้บริหารทราบสาเหตุ
  if (decision === 'reject' && note.length < 3) {
    window.utils.showAlert('#decision-alert', 'กรุณาระบุเหตุผลการปฏิเสธอย่างน้อย 3 ตัวอักษร', 'error');
    document.getElementById('decision-note').focus();
    return;
  }
  if (decision === 'request_doc' && note.length < 3) {
    window.utils.showAlert('#decision-alert', 'กรุณาพิมพ์ในช่องหมายเหตุว่าต้องการเอกสารอะไร เช่น ใบรับรองแพทย์', 'error');
    document.getElementById('decision-note').focus();
    return;
  }

  const btn1 = document.getElementById('btn-approve');
  const btn2 = document.getElementById('btn-reject');
  const btn3 = document.getElementById('btn-request-doc');
  btn1.disabled = true; btn2.disabled = true; btn3.disabled = true;

  const r = await window.api.post('approveLeave', {
    lineUserId: window.state.lineUserId,
    leave_id: CURRENT_LEAVE.leave_id,
    stage: CURRENT_STAGE,
    decision: decision,
    note: note,
  });

  btn1.disabled = false; btn2.disabled = false; btn3.disabled = false;

  if (!r.ok) {
    window.utils.showAlert('#decision-alert', r.message || 'ทำรายการไม่สำเร็จ กรุณาลองอีกครั้ง', 'error');
    return;
  }
  window.utils.showToast(
    decision === 'approve' ? 'อนุมัติเรียบร้อย'
    : decision === 'reject' ? 'ปฏิเสธเรียบร้อย'
    : r.delivered_to_requester ? 'ส่งคำขอเอกสารถึงผู้ลาแล้ว'
    : 'บันทึกคำขอแล้ว แต่ผู้ลายังไม่ผูกไลน์ — HR ได้รับแจ้งให้ติดต่อผู้ลา');
  document.getElementById('decision-overlay').classList.add('hidden');
  await loadList();
}

document.getElementById('btn-approve').onclick = () => decide('approve');
document.getElementById('btn-reject').onclick = () => decide('reject');
document.getElementById('btn-request-doc').onclick = () => decide('request_doc');
</script>
</body>
</html>
