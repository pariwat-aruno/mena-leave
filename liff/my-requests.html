<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ใบลาของฉัน — MENA COSMETICS</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <img class="logo" src="./img/logo.jpg" alt="logo" onerror="this.style.visibility='hidden'">
    <div class="brand">
      <div class="brand-name">MENA COSMETICS</div>
      <div class="page-title">ใบลาของฉัน</div>
    </div>
  </header>

  <main class="app-main">
    <div id="loading" class="loader"><div class="spinner"></div>กำลังโหลด...</div>

    <div id="not-registered" class="hidden">
      <div class="alert warning">คุณยังไม่ได้ผูกบัญชีกับระบบ</div>
      <a class="btn primary block" href="./claim.html">ผูกบัญชีของฉัน</a>
      <a class="btn secondary block mt-1" href="./myid.html">ดูสถานะของฉัน</a>
    </div>

    <div id="content" class="hidden">
      <a class="btn primary block mb-2" href="./request.html">+ ส่งใบลาใหม่</a>
      <div id="list"></div>
    </div>

    <!-- detail modal-ish (simple overlay) -->
    <div id="detail-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;overflow-y:auto;padding:20px">
      <div style="max-width:480px;margin:0 auto;background:white;border-radius:10px;padding:16px;position:relative">
        <button id="btn-close-detail" style="position:absolute;top:8px;right:8px;background:none;border:none;font-size:24px;cursor:pointer">✕</button>
        <h2 class="section-title">รายละเอียดใบลา</h2>
        <div id="detail-body"></div>
      </div>
    </div>

    <div class="page-footer">MENA COSMETICS</div>
  </main>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/role.js"></script>
<script src="./js/utils.js"></script>
<script>
(async function () {
  try { await window.auth.init(); }
  catch (err) {
    document.getElementById('loading').innerHTML = '<div class="alert error">' + err.message + '</div>';
    return;
  }

  const status = await window.api.post('getMyStatus', { lineUserId: window.state.lineUserId });
  document.getElementById('loading').classList.add('hidden');

  if (!status.ok || status.status !== 'active') {
    document.getElementById('not-registered').classList.remove('hidden');
    return;
  }

  document.getElementById('content').classList.remove('hidden');
  await loadList();

  // เปิดจากการ์ด "ผู้อนุมัติขอเอกสารเพิ่ม" → เด้งใบนั้นขึ้นมาเลย
  const openId = new URLSearchParams(location.search).get('id') ||
    new URLSearchParams((new URLSearchParams(location.search).get('liff.state') || '').replace(/^[^?]*\?/, '')).get('id');
  if (openId) showDetail(openId);
})();

async function loadList() {
  const r = await window.api.post('getMyHistory', { lineUserId: window.state.lineUserId });
  const list = document.getElementById('list');
  if (!r.ok) {
    list.innerHTML = '<div class="alert error">โหลดข้อมูลไม่สำเร็จ</div>';
    return;
  }
  if (!r.requests.length) {
    list.innerHTML = '<div class="empty">ยังไม่มีใบลา</div>';
    return;
  }
  list.innerHTML = r.requests.map(req => {
    const ltLabel = window.LEAVE_TYPE_LABELS[req.leave_type] || req.leave_type;
    const fStr = window.utils.formatThaiDateShort(req.date_from);
    const tStr = window.utils.formatThaiDateShort(req.date_to);
    const dateStr = fStr === tStr ? fStr : (fStr + ' - ' + tStr);
    const isCancel = req.record_type === 'cancel';
    const statusLabel = window.STATUS_LABELS[req.final_status] || req.final_status;
    return '<div class="list-row" onclick="showDetail(\'' + req.leave_id + '\')">' +
      '<div class="info">' +
        '<div class="name">' + (isCancel ? 'ขอยกเลิก · ' : '') + ltLabel + ' · ' + window.utils.escapeHtml(req.amount_text || (req.days + ' วัน')) + '</div>' +
        '<div class="meta">' + dateStr +
          (req.is_emergency ? ' · ลากะทันหัน' : '') +
          (req.doc_request_status === 'requested' ? ' · <strong style="color:#b3261e">ผู้อนุมัติขอเอกสารเพิ่ม</strong>'
            : req.doc_pending ? ' · รอแนบใบรับรองแพทย์' : '') + '</div>' +
      '</div>' +
      '<span class="badge ' + req.final_status + '">' + statusLabel + '</span>' +
    '</div>';
  }).join('');
}

async function showDetail(leaveId) {
  const r = await window.api.post('getOneRequest', { lineUserId: window.state.lineUserId, leave_id: leaveId });
  if (!r.ok) {
    window.utils.showToast('โหลดไม่สำเร็จ: ' + r.error);
    return;
  }
  const l = r.leave;
  const body = document.getElementById('detail-body');

  const ownerFirst = l.stage2_status === 'skipped' && l.stage3_status === 'skipped' && l.stage1_status !== 'skipped';
  const stages = [
    { n: 1, label: ownerFirst ? 'ผู้บริหาร (ผู้อนุมัติขั้นแรก)' : 'หัวหน้างาน', status: l.stage1_status, at: l.stage1_at, note: l.stage1_note },
    { n: 2, label: 'ฝ่ายบุคคล (HR)', status: l.stage2_status, at: l.stage2_at, note: l.stage2_note },
    { n: 3, label: 'ผู้บริหาร', status: l.stage3_status, at: l.stage3_at, note: l.stage3_note },
  ];

  const isCancel = l.record_type === 'cancel';

  body.innerHTML =
    (isCancel ? '<div class="alert info">ใบขอยกเลิกวันลา (ของใบ ' + window.utils.escapeHtml(l.parent_leave_id || '-') + ')</div>' : '') +
    (l.doc_request_status === 'requested'
      ? '<div class="alert error"><strong>ผู้อนุมัติขอเอกสารเพิ่ม</strong><div>' +
        window.utils.escapeHtml(l.doc_request_note || '-') + '</div><div class="mt-1">แนบรูปที่ช่อง "แนบเอกสารเพิ่ม" ด้านล่าง แล้วระบบจะส่งกลับไปให้ผู้อนุมัติ</div></div>'
      : '') +
    (l.doc_pending && l.doc_request_status !== 'requested'
      ? '<div class="alert warning">ยังไม่ได้แนบใบรับรองแพทย์ — ได้มาแล้วแนบที่ด้านล่างได้เลย</div>' : '') +
    (l.is_emergency ? '<div class="alert warning">ลากะทันหัน / แจ้งไม่ทันกำหนด: ' +
      window.utils.escapeHtml(l.emergency_reason || '-') + '</div>' : '') +
    '<div class="card">' +
      '<div class="card-row"><span class="label">เลขที่</span><span class="value">' + l.leave_id + '</span></div>' +
      '<div class="card-row"><span class="label">ประเภท</span><span class="value">' + (window.LEAVE_TYPE_LABELS[l.leave_type] || l.leave_type) + (l.is_retroactive && !isCancel ? ' (ย้อนหลัง)' : '') + '</span></div>' +
      '<div class="card-row"><span class="label">วันที่</span><span class="value">' + window.utils.formatThaiDateShort(l.date_from) + (l.date_from === l.date_to ? '' : ' - ' + window.utils.formatThaiDateShort(l.date_to)) + '</span></div>' +
      '<div class="card-row"><span class="label">จำนวน</span><span class="value">' + window.utils.escapeHtml(l.amount_text || (l.days + ' วัน')) + '</span></div>' +
      '<div class="card-row"><span class="label">เหตุผล</span><span class="value">' + window.utils.escapeHtml(l.reason || '-') + '</span></div>' +
      '<div class="card-row"><span class="label">สถานะ</span><span class="badge ' + l.final_status + '">' + (window.STATUS_LABELS[l.final_status] || l.final_status) + '</span></div>' +
    '</div>' +
    attachmentLinks(l) +
    buildAttachBox(l) +
    buildActions(l) +
    '<h2 class="section-title">ลำดับการอนุมัติ</h2>' +
    '<div class="timeline">' +
      stages.map(s => {
        const cls = s.status === 'approved' ? 'approved' : s.status === 'rejected' ? 'rejected' : s.status === 'skipped' ? 'skipped' : 'pending';
        const statusLabel = s.status === 'skipped' ? 'ข้าม' : window.STATUS_LABELS[s.status];
        return '<div class="timeline-item ' + cls + '">' +
          '<div class="stage">ชั้น ' + s.n + ' · ' + s.label + ' · <span class="badge ' + s.status + '">' + statusLabel + '</span></div>' +
          (s.at ? '<div class="meta">' + window.utils.formatThaiDateTime(s.at) + '</div>' : '') +
          (s.note ? '<div class="meta">หมายเหตุ: ' + window.utils.escapeHtml(s.note) + '</div>' : '') +
        '</div>';
      }).join('') +
    '</div>';

  bindActionButton();
  bindAttachBox();
  document.getElementById('detail-overlay').classList.remove('hidden');
}

/** ลิงก์ไฟล์แนบตอนส่ง + ที่แนบเพิ่มทีหลัง */
function attachmentLinks(l) {
  const links = [];
  if (l.attachment_url) links.push({ url: l.attachment_url, label: 'ไฟล์แนบตอนส่ง' });
  (l.extra_attachments || []).forEach((a, i) => {
    links.push({ url: a.url, label: 'แนบเพิ่ม ' + (i + 1) + (a.at ? ' · ' + window.utils.formatThaiDateTime(a.at) : '') +
      (a.note ? ' · ' + a.note : '') });
  });
  if (!links.length) return '';
  return '<div class="mt-2">' + links.map(x =>
    '<a class="btn ghost sm block mt-1" style="min-height:44px;display:flex;align-items:center;justify-content:center" target="_blank" rel="noopener" href="' + window.utils.escapeHtml(x.url) + '">' +
    window.utils.escapeHtml(x.label) + '</a>').join('') + '</div>';
}

/**
 * แนบเอกสารเพิ่ม — ใบรับรองแพทย์ที่ได้มาทีหลัง / ตามที่ผู้อนุมัติขอ
 * ได้ทั้งใบที่รออนุมัติและที่อนุมัติแล้ว
 */
let ATTACH_FILE = null;
function buildAttachBox(l) {
  if (l.record_type === 'cancel') return '';
  if (['pending', 'approved'].indexOf(l.final_status) < 0) return '';
  const urgent = l.doc_request_status === 'requested';
  return '<div class="card ' + (urgent ? '' : 'soft ') + 'mt-2" id="attach-box">' +
    '<h3 class="section-title" style="font-size:15px;margin-top:0">แนบเอกสารเพิ่ม</h3>' +
    '<p class="subtle">เช่น ใบรับรองแพทย์ ใบนัด — ถ่ายรูปหรือเลือกจากแกลเลอรีได้ แนบได้หลายครั้ง</p>' +
    '<input type="file" id="attach-input" accept="image/*">' +
    '<div id="attach-preview" class="hidden attachment-preview"><img id="attach-img" alt="ตัวอย่าง"></div>' +
    '<input type="text" id="attach-note" class="mt-1" maxlength="100" placeholder="คำอธิบาย (ไม่บังคับ) เช่น ใบรับรองแพทย์">' +
    '<div id="attach-alert" class="hidden"></div>' +
    '<button class="btn primary block mt-1" id="btn-attach" data-leave="' + l.leave_id + '">ส่งเอกสาร</button>' +
  '</div>';
}

function bindAttachBox() {
  ATTACH_FILE = null;
  const input = document.getElementById('attach-input');
  const btn = document.getElementById('btn-attach');
  if (!input || !btn) return;
  input.onchange = async (e) => {
    const file = e.target.files[0];
    ATTACH_FILE = null;
    document.getElementById('attach-preview').classList.add('hidden');
    if (!file) return;
    try {
      ATTACH_FILE = await window.utils.fileToResizedBase64(file);
      document.getElementById('attach-img').src = ATTACH_FILE.base64;
      document.getElementById('attach-preview').classList.remove('hidden');
    } catch (err) {
      window.utils.showAlert('#attach-alert', 'ไฟล์นี้ใช้ไม่ได้ กรุณาเลือกรูปภาพ', 'error');
    }
  };
  btn.onclick = async () => {
    window.utils.clearAlert('#attach-alert');
    if (!ATTACH_FILE) return window.utils.showAlert('#attach-alert', 'กรุณาเลือกรูปก่อน', 'error');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'กำลังส่ง...';
    const r = await window.api.post('addLeaveAttachment', {
      lineUserId: window.state.lineUserId,
      leave_id: btn.dataset.leave,
      attachment_base64: ATTACH_FILE.base64,
      attachment_filename: ATTACH_FILE.filename,
      note: (document.getElementById('attach-note').value || '').trim(),
    });
    btn.disabled = false; btn.textContent = label;
    if (!r.ok) return window.utils.showAlert('#attach-alert', r.message || 'ส่งเอกสารไม่สำเร็จ กรุณาลองอีกครั้ง', 'error');
    window.utils.showToast(r.request_cleared ? 'ส่งเอกสารแล้ว ระบบแจ้งผู้อนุมัติให้แล้ว' : 'แนบเอกสารเรียบร้อย');
    await showDetail(btn.dataset.leave);
    await loadList();
  };
}

/**
 * ปุ่มถอน / ขอยกเลิก
 *   ยังไม่มีใครกด  → ถอนเองได้เลย
 *   อนุมัติครบแล้ว → ต้องขออนุมัติยกเลิกตามสายเดิม
 * ใบขอยกเลิกเองไม่ต้องมีปุ่มพวกนี้ (ยกเลิกใบยกเลิกซ้อนกันไปเรื่อย ๆ ไม่มีประโยชน์)
 */
function buildActions(l) {
  if (l.record_type === 'cancel') return '';

  // ห้ามใช้ prompt() — LINE webview บางเครื่องบล็อกเงียบ ผู้ใช้จะกดแล้วไม่มีอะไรเกิดขึ้น
  if (l.final_status === 'pending') {
    return '<div class="card soft mt-2" id="action-box">' +
      '<p class="subtle">ยังไม่มีผู้อนุมัติคนไหนกด — ถอนใบลานี้เองได้ทันที โควตาที่จองไว้จะคืนให้</p>' +
      '<textarea id="action-reason" rows="2" class="mt-1" placeholder="เหตุผลที่ถอน (ไม่บังคับ)"></textarea>' +
      '<div id="action-alert" class="hidden"></div>' +
      '<button class="btn ghost block mt-1" id="btn-action" data-mode="withdraw" data-leave="' + l.leave_id + '">ถอนใบลานี้</button>' +
    '</div>';
  }

  if (l.final_status === 'approved') {
    return '<div class="card soft mt-2" id="action-box">' +
      '<p class="subtle">ต้องการยกเลิกวันลาที่อนุมัติแล้ว? ระบบจะส่งใบขอยกเลิกให้ผู้อนุมัติชุดเดิมพิจารณาอีกครั้ง</p>' +
      '<textarea id="action-reason" rows="2" class="mt-1" placeholder="เหตุผลที่ขอยกเลิก (อย่างน้อย 5 ตัวอักษร)"></textarea>' +
      '<div id="action-alert" class="hidden"></div>' +
      '<button class="btn ghost block mt-1" id="btn-action" data-mode="cancel" data-leave="' + l.leave_id + '">ขอยกเลิกวันลา</button>' +
    '</div>';
  }

  return '';
}

/** ผูกปุ่มหลังวาด detail เสร็จ (ปุ่มเพิ่งถูกสร้างใหม่ทุกครั้งที่เปิด) */
function bindActionButton() {
  const btn = document.getElementById('btn-action');
  if (!btn) return;
  btn.onclick = async () => {
    const mode = btn.dataset.mode;
    const leaveId = btn.dataset.leave;
    const reason = (document.getElementById('action-reason').value || '').trim();

    window.utils.clearAlert('#action-alert');
    if (mode === 'cancel' && reason.length < 5) {
      return window.utils.showAlert('#action-alert', 'กรุณาระบุเหตุผลอย่างน้อย 5 ตัวอักษร', 'error');
    }

    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'กำลังส่ง...';

    const r = mode === 'withdraw'
      ? await window.api.post('withdrawLeave', {
          lineUserId: window.state.lineUserId, leave_id: leaveId, reason: reason })
      : await window.api.post('requestCancelLeave', {
          lineUserId: window.state.lineUserId, leave_id: leaveId, reason: reason });

    btn.disabled = false; btn.textContent = label;

    if (!r.ok) {
      return window.utils.showAlert('#action-alert', r.message || ('ไม่สำเร็จ: ' + r.error), 'error');
    }

    window.utils.showToast(
      mode === 'withdraw' ? 'ถอนใบลาเรียบร้อย'
      : r.final_status === 'approved' ? 'ยกเลิกวันลาเรียบร้อย'
      : 'ส่งใบขอยกเลิกแล้ว รอผู้อนุมัติพิจารณา');
    document.getElementById('detail-overlay').classList.add('hidden');
    await loadList();
  };
}

document.getElementById('btn-close-detail').onclick = () => {
  document.getElementById('detail-overlay').classList.add('hidden');
};
</script>
</body>
</html>
